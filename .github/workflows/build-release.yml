name: Build HV P2P SRVR — macOS Intel Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  APP_VERSION: v26.08.15.07
  APP_NAME: HV P2P SRVR

jobs:
  macos-intel:
    name: macOS Intel — Fast Unsigned Test Build
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - name: Checkout SRVR source
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Validate source
        shell: bash
        run: |
          python3 -m py_compile \
            source/main.py \
            source/bridge.py \
            source/backend_worker.py \
            source/hv_p2p_legacy_core.py

      - name: Build self-contained Qt application
        shell: bash
        run: |
          chmod +x build/build_macos.sh
          ./build/build_macos.sh

      - name: Verify application bundle exists
        shell: bash
        run: |
          set -euo pipefail
          APP="dist-macos/${APP_NAME} ${APP_VERSION}.app"
          test -d "$APP"
          echo "Built test app: $APP"
          du -sh "$APP" || true

      - name: Package macOS Intel test application
        shell: bash
        run: |
          set -euo pipefail
          APP="dist-macos/${APP_NAME} ${APP_VERSION}.app"
          OUT="${APP_NAME} ${APP_VERSION} macOS Intel Test.zip"
          rm -f "$OUT"
          ditto -c -k --keepParent "$APP" "$OUT"
          echo "MACOS_ARTIFACT=$OUT" >> "$GITHUB_ENV"

      - name: Upload macOS Intel test artifact
        uses: actions/upload-artifact@v4
        with:
          name: HV-P2P-SRVR-${{ env.APP_VERSION }}-macOS-Intel-Test
          path: HV P2P SRVR v26.08.15.07 macOS Intel Test.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
