name: HV P2P SRVR - Qt Quick macOS Intel Test Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'main.py'
      - 'backend.py'
      - 'qml/**'
      - 'resources.qrc'
      - 'HV_P2P_SRVR.pyproject'
      - 'requirements.txt'
      - 'tools/**'
      - '.github/workflows/build-macos-intel.yml'

permissions:
  contents: read

jobs:
  build-macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 50
    env:
      APP_VERSION: '26.08.17.15'
      QT_QUICK_CONTROLS_STYLE: Basic
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm Intel runner
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          test "$(uname -m)" = "x86_64"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Static project preflight
        shell: bash
        run: |
          set -euxo pipefail
          python tools/validate_project.py
          python -m py_compile main.py backend.py tools/__init__.py tools/validate_project.py tools/test_backend_logic.py

      - name: Install Qt for Python
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python - <<'PY'
          import platform
          import PySide6
          print('Python:', platform.python_version())
          print('PySide6:', PySide6.__version__)
          print('Machine:', platform.machine())
          assert platform.machine() == 'x86_64'
          PY

      - name: Backend safety and calibration regression tests
        shell: bash
        run: |
          set -euxo pipefail
          # Explicitly prove CI can import the application backend before running
          # the larger regression suite. This catches path mistakes immediately.
          PYTHONPATH="$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}" python - <<'PY'
          import backend
          print("backend import PASS:", backend.__file__)
          PY
          PYTHONPATH="$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}" python -m tools.test_backend_logic

      - name: Create isolated deployment source tree
        shell: bash
        run: |
          set -euxo pipefail
          STAGE="$RUNNER_TEMP/hvp2p-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          # Explicit allow-list only.  The v26.08.17.03/.04 failures happened
          # because pyside6-deploy/Nuitka could see the repository .github
          # directory.  Deployment now runs outside GITHUB_WORKSPACE, so that
          # directory physically cannot be bundled.
          cp main.py backend.py resources.qrc HV_P2P_SRVR.pyproject "$STAGE/"
          cp -R qml "$STAGE/"
          cp assets/HV_P2P_SRVR_icon.png "$STAGE/HV_P2P_SRVR_icon.png"

          echo 'Staged files:'
          find "$STAGE" -maxdepth 4 -print | sort

          # Hard guarantee: source-control/build metadata does not exist in the
          # deployment tree before Qt/Nuitka starts.
          test ! -e "$STAGE/.github"
          test ! -e "$STAGE/.git"
          test ! -e "$STAGE/assets"
          test ! -e "$STAGE/release"
          test ! -e "$STAGE/tools"
          test ! -e "$STAGE/.github"
          test ! -e "$STAGE/.git"

      - name: Generate resources and validate QML in isolated tree
        shell: bash
        run: |
          set -euxo pipefail
          STAGE="$RUNNER_TEMP/hvp2p-stage"
          cd "$STAGE"

          # resources.qrc convention is rc_<qrc basename>.py.  This exact name
          # also satisfies pyside6-deploy's dependency scanner.
          pyside6-rcc resources.qrc -o rc_resources.py
          test -s rc_resources.py
          python -m py_compile main.py backend.py rc_resources.py

          # Qt's own QML syntax/type checker is authoritative for the frontend.
          pyside6-qmllint --max-warnings -1 qml/Main.qml qml/components/*.qml qml/pages/*.qml

          # Prove the source application can instantiate all four pages, all
          # Shortcuts tabs and the calibration overlay without opening hardware
          # sockets or requiring a display server.
          QT_QPA_PLATFORM=offscreen python main.py --smoke-test

      - name: Inspect deployment command
        shell: bash
        run: |
          set -euxo pipefail
          STAGE="$RUNNER_TEMP/hvp2p-stage"
          cd "$STAGE"

          # Create the deployment config explicitly. Qt documents --init as the
          # deterministic way to create pysidedeploy.spec; do not depend on a
          # dry-run side effect to create it.
          rm -f pysidedeploy.spec
          pyside6-deploy main.py --init
          test -s pysidedeploy.spec

          pyside6-deploy main.py -f --dry-run \
            --name "HV P2P SRVR" \
            --extra-ignore-dirs=.git,.github,assets,build,release,__pycache__ \
            --extra-modules=Quick,QuickControls2,Qml,Gui,Network | tee deploy-dry-run.txt

          # The generated Nuitka command must be scoped to the isolated stage,
          # never the checked-out repository or its .github directory.
          if grep -F "$GITHUB_WORKSPACE/.github" deploy-dry-run.txt; then
            echo 'ERROR: deployment command references repository .github directory'
            exit 1
          fi


          # Audit the generated config. Paths may be absolute or relative depending
          # on the PySide6 release, so do not reject a valid spec merely because
          # it does not contain a particular textual path. The important safety
          # property is that it must never reference the checked-out repository
          # metadata, and deployment itself occurs from the isolated stage.
          test -s pysidedeploy.spec
          echo 'Generated deployment spec:'
          cat pysidedeploy.spec
          if grep -F "$GITHUB_WORKSPACE/.github" pysidedeploy.spec; then
            echo 'ERROR: generated deployment spec references the checked-out repository .github directory'
            exit 1
          fi

      - name: Deploy Qt Quick macOS application
        shell: bash
        run: |
          set -euxo pipefail
          STAGE="$RUNNER_TEMP/hvp2p-stage"
          cd "$STAGE"

          pyside6-deploy main.py -f \
            --name "HV P2P SRVR" \
            --extra-ignore-dirs=.git,.github,assets,build,release,__pycache__ \
            --extra-modules=Quick,QuickControls2,Qml,Gui,Network

          APP_PATH="$(find "$STAGE" -maxdepth 2 -type d -name '*.app' | head -n 1)"
          test -n "$APP_PATH"
          test -d "$APP_PATH/Contents/MacOS"
          test -f "$APP_PATH/Contents/Info.plist"
          echo "Built app: $APP_PATH"

          # Restore the project bundle identity/icon explicitly. The supplied
          # v26.08.17.11 working app still carried generic `main` display metadata
          # and PySide's default icon even though the source already contains the
          # approved P2P SRVR icon asset. Perform these edits before final signing.
          ICONSET="$STAGE/HV_P2P_SRVR.iconset"
          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"
          sips -z 16 16     HV_P2P_SRVR_icon.png --out "$ICONSET/icon_16x16.png" >/dev/null
          sips -z 32 32     HV_P2P_SRVR_icon.png --out "$ICONSET/icon_16x16@2x.png" >/dev/null
          sips -z 32 32     HV_P2P_SRVR_icon.png --out "$ICONSET/icon_32x32.png" >/dev/null
          sips -z 64 64     HV_P2P_SRVR_icon.png --out "$ICONSET/icon_32x32@2x.png" >/dev/null
          sips -z 128 128   HV_P2P_SRVR_icon.png --out "$ICONSET/icon_128x128.png" >/dev/null
          sips -z 256 256   HV_P2P_SRVR_icon.png --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          sips -z 256 256   HV_P2P_SRVR_icon.png --out "$ICONSET/icon_256x256.png" >/dev/null
          sips -z 512 512   HV_P2P_SRVR_icon.png --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          sips -z 512 512   HV_P2P_SRVR_icon.png --out "$ICONSET/icon_512x512.png" >/dev/null
          cp HV_P2P_SRVR_icon.png "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o "$STAGE/HV_P2P_SRVR.icns"
          test -s "$STAGE/HV_P2P_SRVR.icns"
          cp "$STAGE/HV_P2P_SRVR.icns" "$APP_PATH/Contents/Resources/HV_P2P_SRVR.icns"

          PLIST="$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Delete :CFBundleDisplayName' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDisplayName string HV P2P SRVR' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleName HV P2P SRVR' "$PLIST" || /usr/libexec/PlistBuddy -c 'Add :CFBundleName string HV P2P SRVR' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Delete :CFBundleIconFile' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIconFile string HV_P2P_SRVR.icns' "$PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST")" = 'HV P2P SRVR'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$PLIST")" = 'HV P2P SRVR'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$PLIST")" = 'HV_P2P_SRVR.icns'

          # The exact v03/v04 failure is now checked again on the completed app.
          LEAKS="$(find "$APP_PATH/Contents" \
            \( -type d \( -name '.github' -o -name '.git' -o -name '__pycache__' -o -name 'tools' \) \
            -o -type f \( -name '*.yml' -o -name '*.yaml' -o -name '*.pyproject' \) \) -print || true)"
          if [ -n "$LEAKS" ]; then
            echo 'ERROR: repository/build metadata leaked into app bundle:'
            echo "$LEAKS"
            exit 1
          fi

          EXE="$(find "$APP_PATH/Contents/MacOS" -maxdepth 1 -type f -perm +111 | head -n 1)"
          test -n "$EXE"
          file "$EXE"
          lipo -info "$EXE" || true
          file "$EXE" | grep -q 'x86_64'

          # Confirm Qt platform/QML runtime content exists before signing.
          find "$APP_PATH/Contents" -iname '*qcocoa*' -o -iname '*QtQuick*' | head -n 40 || true

          # Strip incidental extended attributes before the final signature check.
          # This keeps the software-distribution ZIP free of AppleDouble metadata
          # and avoids depending on ditto's --sequesterRsrc mechanism. Any impact
          # on an existing ad-hoc signature is handled immediately below.
          xattr -cr "$APP_PATH" || true

          # Bundle identity/icon edits above intentionally invalidate any prior
          # deployment signature, so verify first and apply a fresh ad-hoc
          # development signature when required. This is NOT Developer ID signing/notarising.
          if codesign --verify --deep --strict --verbose=2 "$APP_PATH"; then
            echo 'Qt/Nuitka bundle signature is already valid; leaving it untouched.'
          else
            echo 'Existing bundle signature is not valid; applying development ad-hoc signature.'
            codesign --force --deep --sign - --timestamp=none "$APP_PATH"
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          fi

          # Frozen-app smoke test: use the Cocoa plugin that the real Mac app
          # will use, rather than relying on a headless plugin that deployment
          # might legitimately omit from a production bundle.
          QT_QPA_PLATFORM=cocoa "$EXE" --smoke-test

          # Copy the already verified app to the workspace. Nothing inside the
          # app is modified after this point.
          mkdir -p "$GITHUB_WORKSPACE/release"
          rm -rf "$GITHUB_WORKSPACE/release/HV P2P SRVR.app"
          ditto "$APP_PATH" "$GITHUB_WORKSPACE/release/HV P2P SRVR.app"
          codesign --verify --deep --strict --verbose=2 "$GITHUB_WORKSPACE/release/HV P2P SRVR.app"

      - name: Package permission-safe application ZIP
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          ZIP="HV P2P SRVR v${APP_VERSION} macOS Intel.zip"
          rm -f "$ZIP"
          # IMPORTANT: Do not use --sequesterRsrc here. That option intentionally
          # creates a parallel __MACOSX hierarchy for AppleDouble metadata. It was
          # the sole cause of the v26.08.17.06 packaging assertion failure, and
          # Apple DTS also advises against it for software-distribution ZIPs.
          ditto -c -k --keepParent "release/HV P2P SRVR.app" "$ZIP"

          # Validate the archive structurally before upload. There must be exactly
          # one visible top-level bundle and no source/repository metadata.
          python - <<'PY'
          import os, zipfile
          version = os.environ['APP_VERSION']
          z = f'HV P2P SRVR v{version} macOS Intel.zip'
          with zipfile.ZipFile(z) as f:
              names = f.namelist()
              bad_crc = f.testzip()
          assert names, 'empty ZIP'
          assert bad_crc is None, f'ZIP CRC failure: {bad_crc}'

          # No __MACOSX tree should be produced now that --sequesterRsrc is gone.
          macosx = [n for n in names if n == '__MACOSX/' or n.startswith('__MACOSX/')]
          assert not macosx, f'unexpected __MACOSX metadata in release ZIP: {macosx[:20]}'

          top = {n.split('/', 1)[0] for n in names if n and not n.startswith('/') }
          assert top == {'HV P2P SRVR.app'}, f'unexpected top-level ZIP entries: {sorted(top)}'
          assert all(n == 'HV P2P SRVR.app/' or n.startswith('HV P2P SRVR.app/') for n in names), names[:30]

          forbidden = ('.github/', '/.github/', '.git/', '/.git/', '__pycache__/', '.pyproject', '.yml', '.yaml')
          bad = [n for n in names if any(token in n for token in forbidden)]
          assert not bad, f'repository metadata leaked into release ZIP: {bad[:20]}'

          required = [
              'HV P2P SRVR.app/Contents/Info.plist',
              'HV P2P SRVR.app/Contents/MacOS/',
          ]
          for req in required:
              assert any(n == req or n.startswith(req) for n in names), f'missing required app content: {req}'
          assert any(n.startswith('HV P2P SRVR.app/Contents/_CodeSignature/') for n in names), 'missing code signature resources'
          print(f'Release ZIP verified: {len(names)} entries, one HV P2P SRVR.app bundle only.')
          PY

          # Also round-trip the ZIP using macOS ditto, then verify the extracted
          # application exactly as a user download will be extracted. This catches
          # archive-layout, executable-permission, symlink and signature problems
          # before GitHub is allowed to publish the artifact.
          VERIFY_DIR="$RUNNER_TEMP/hvp2p-zip-roundtrip"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          ditto -x -k "$ZIP" "$VERIFY_DIR"
          test -d "$VERIFY_DIR/HV P2P SRVR.app"
          test "$(find "$VERIFY_DIR" -mindepth 1 -maxdepth 1 -print | wc -l | tr -d ' ')" = "1"
          test ! -e "$VERIFY_DIR/__MACOSX"
          ROUNDTRIP_APP="$VERIFY_DIR/HV P2P SRVR.app"
          ROUNDTRIP_EXE="$(find "$ROUNDTRIP_APP/Contents/MacOS" -maxdepth 1 -type f -perm +111 | head -n 1)"
          test -n "$ROUNDTRIP_EXE"
          file "$ROUNDTRIP_EXE" | grep -q 'x86_64'
          codesign --verify --deep --strict --verbose=2 "$ROUNDTRIP_APP"
          QT_QPA_PLATFORM=cocoa "$ROUNDTRIP_EXE" --smoke-test
          echo 'Round-trip ZIP extraction + signature + frozen-app smoke test PASS.'

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: HV-P2P-SRVR-v26.08.17.15-macOS-Intel
          path: HV P2P SRVR v26.08.17.15 macOS Intel.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
