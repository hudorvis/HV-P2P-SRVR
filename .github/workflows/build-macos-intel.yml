name: HV P2P SRVR - Qt Quick macOS Intel Test Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'main.py'
      - 'backend.py'
      - 'qml/**'
      - 'resources.qrc'
      - 'requirements.txt'
      - 'assets/**'
      - '.github/workflows/build-macos-intel.yml'

permissions:
  contents: read

jobs:
  build-macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      APP_VERSION: '26.08.17.03'
      QT_QUICK_CONTROLS_STYLE: Basic

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm Intel runner
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          test "$(uname -m)" = "x86_64"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Qt for Python
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python - <<'PY'
          import PySide6
          print('PySide6:', PySide6.__version__)
          PY

      - name: Generate embedded Qt resources
        shell: bash
        run: |
          set -euxo pipefail
          pyside6-rcc resources.qrc -o resources_rc.py
          python -m py_compile main.py backend.py resources_rc.py

      - name: QML lint
        shell: bash
        run: |
          set -euxo pipefail
          pyside6-qmllint qml/Main.qml qml/components/*.qml

      - name: Build app icon
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/AppIcon.iconset
          sips -z 16 16     assets/HV_P2P_SRVR_icon.png --out build/AppIcon.iconset/icon_16x16.png
          sips -z 32 32     assets/HV_P2P_SRVR_icon.png --out build/AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/HV_P2P_SRVR_icon.png --out build/AppIcon.iconset/icon_32x32.png
          sips -z 64 64     assets/HV_P2P_SRVR_icon.png --out build/AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/HV_P2P_SRVR_icon.png --out build/AppIcon.iconset/icon_128x128.png
          sips -z 256 256   assets/HV_P2P_SRVR_icon.png --out build/AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/HV_P2P_SRVR_icon.png --out build/AppIcon.iconset/icon_256x256.png
          sips -z 512 512   assets/HV_P2P_SRVR_icon.png --out build/AppIcon.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/HV_P2P_SRVR_icon.png --out build/AppIcon.iconset/icon_512x512.png
          cp assets/HV_P2P_SRVR_icon.png build/AppIcon.iconset/icon_512x512@2x.png
          iconutil -c icns build/AppIcon.iconset -o build/HV_P2P_SRVR.icns

      - name: Deploy Qt Quick macOS application
        shell: bash
        run: |
          set -euxo pipefail
          pyside6-deploy main.py -f --name "HV P2P SRVR" --extra-modules=Quick,Qml,Gui,Network

          APP_PATH="$(find . -type d -name '*.app' -not -path './.git/*' | head -n 1)"
          test -n "$APP_PATH"
          echo "Built app: $APP_PATH"

          mkdir -p release
          rm -rf "release/HV P2P SRVR.app"
          ditto "$APP_PATH" "release/HV P2P SRVR.app"

          # Make every bundle change BEFORE the final ad-hoc signature.
          mkdir -p "release/HV P2P SRVR.app/Contents/Resources"
          cp build/HV_P2P_SRVR.icns "release/HV P2P SRVR.app/Contents/Resources/HV_P2P_SRVR.icns"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName HV P2P SRVR" "release/HV P2P SRVR.app/Contents/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleName HV P2P SRVR" "release/HV P2P SRVR.app/Contents/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier au.h-v.hvp2p.srvr" "release/HV P2P SRVR.app/Contents/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${APP_VERSION}" "release/HV P2P SRVR.app/Contents/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${APP_VERSION}" "release/HV P2P SRVR.app/Contents/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIconFile" "release/HV P2P SRVR.app/Contents/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string HV_P2P_SRVR.icns" "release/HV P2P SRVR.app/Contents/Info.plist"

          EXE="$(find 'release/HV P2P SRVR.app/Contents/MacOS' -type f -perm +111 | head -n 1)"
          test -n "$EXE"
          file "$EXE"
          lipo -info "$EXE" || true

          # Development-only ad-hoc signature. This is NOT Developer ID signing
          # and does NOT notarise the app. It simply ensures the final bundle has
          # a self-consistent signature after we modify its icon and Info.plist.
          codesign --force --deep --sign - --timestamp=none "release/HV P2P SRVR.app"
          codesign --verify --deep --strict --verbose=2 "release/HV P2P SRVR.app"
          codesign -dv --verbose=4 "release/HV P2P SRVR.app" 2>&1 | head -80

      - name: Package app for permission-safe artifact transport
        shell: bash
        run: |
          set -euxo pipefail
          ZIP="HV P2P SRVR v${APP_VERSION} macOS Intel.zip"
          rm -f "$ZIP"
          # Keep the .app in an inner ZIP so GitHub artifact transport cannot
          # strip executable bits or macOS bundle metadata.
          ditto -c -k --sequesterRsrc --keepParent "release/HV P2P SRVR.app" "$ZIP"
          unzip -l "$ZIP"
          python - <<'PY'
          import zipfile, os
          version=os.environ['APP_VERSION']
          z=f'HV P2P SRVR v{version} macOS Intel.zip'
          with zipfile.ZipFile(z) as f:
              names=f.namelist()
          assert names, 'empty ZIP'
          assert all(n.startswith('HV P2P SRVR.app/') or n == 'HV P2P SRVR.app/' for n in names), names[:20]
          assert not any(n.endswith('.py') or n.endswith('.txt') for n in names), 'source file leaked into application ZIP'
          print('Application ZIP verified: contains the .app bundle only')
          PY

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: HV-P2P-SRVR-v26.08.17.03-macOS-Intel
          path: HV P2P SRVR v26.08.17.03 macOS Intel.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
