name: HV P2P SRVR - Qt Quick macOS Intel Test Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'main.py'
      - 'backend.py'
      - 'qml/**'
      - 'resources.qrc'
      - 'HV_P2P_SRVR.pyproject'
      - 'requirements.txt'
      - '.github/workflows/build-macos-intel.yml'

permissions:
  contents: read

jobs:
  build-macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      APP_VERSION: '26.08.17.04'
      QT_QUICK_CONTROLS_STYLE: Basic

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm Intel runner
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          test "$(uname -m)" = "x86_64"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Qt for Python
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python - <<'PY'
          import PySide6
          print('PySide6:', PySide6.__version__)
          PY

      - name: Validate project manifest
        shell: bash
        run: |
          set -euxo pipefail
          test -f HV_P2P_SRVR.pyproject
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('HV_P2P_SRVR.pyproject')
          cfg=json.loads(p.read_text())
          files=cfg['files']
          assert files, 'project manifest is empty'
          for f in files:
              assert Path(f).exists(), f'missing project file: {f}'
              assert not f.startswith('.github/'), 'workflow must never be an app source'
          print('Project manifest OK:', len(files), 'source/resource files')
          PY

      - name: Generate embedded Qt resources
        shell: bash
        run: |
          set -euxo pipefail
          pyside6-rcc resources.qrc -o resources_rc.py
          python -m py_compile main.py backend.py resources_rc.py

      - name: QML lint
        shell: bash
        run: |
          set -euxo pipefail
          pyside6-qmllint qml/Main.qml qml/components/*.qml

      - name: Deploy Qt Quick macOS application
        shell: bash
        run: |
          set -euxo pipefail
          # The explicit *.pyproject file limits deployment to actual application
          # sources. The ignore list is a second guard against repository/build
          # metadata being copied into Contents/MacOS.
          pyside6-deploy main.py -f \
            --name "HV P2P SRVR" \
            --extra-ignore-dirs=.git,.github,assets,build,release,__pycache__ \
            --extra-modules=Quick,Qml,Gui,Network

          APP_PATH="$(find . -maxdepth 2 -type d -name '*.app' -not -path './.git/*' | head -n 1)"
          test -n "$APP_PATH"
          echo "Built app: $APP_PATH"

          # Fail immediately if source-control/build metadata has leaked into the
          # application. This was the exact cause of the v26.08.17.03 codesign failure.
          LEAKS="$(find "$APP_PATH/Contents" -type d \( -name '.github' -o -name '.git' -o -name '__pycache__' \) -print || true)"
          if [ -n "$LEAKS" ]; then
            echo "ERROR: repository/build directories leaked into app bundle:"
            echo "$LEAKS"
            exit 1
          fi

          EXE="$(find "$APP_PATH/Contents/MacOS" -maxdepth 1 -type f -perm +111 | head -n 1)"
          test -n "$EXE"
          file "$EXE"
          lipo -info "$EXE" || true
          file "$EXE" | grep -q 'x86_64'

          # Do not edit Info.plist, icon, or bundle contents after pyside6-deploy.
          # First verify the signature produced by the Qt/Nuitka deployment.
          if codesign --verify --deep --strict --verbose=2 "$APP_PATH"; then
            echo "Qt/Nuitka bundle signature verified."
          else
            echo "Qt/Nuitka signature did not verify; applying a development-only ad-hoc signature."
            codesign --force --deep --sign - --timestamp=none "$APP_PATH"
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          fi

          mkdir -p release
          rm -rf "release/HV P2P SRVR.app"
          ditto "$APP_PATH" "release/HV P2P SRVR.app"
          codesign --verify --deep --strict --verbose=2 "release/HV P2P SRVR.app"

      - name: Package permission-safe application ZIP
        shell: bash
        run: |
          set -euxo pipefail
          ZIP="HV P2P SRVR v${APP_VERSION} macOS Intel.zip"
          rm -f "$ZIP"
          ditto -c -k --sequesterRsrc --keepParent "release/HV P2P SRVR.app" "$ZIP"

          python - <<'PY'
          import os, zipfile
          version=os.environ['APP_VERSION']
          z=f'HV P2P SRVR v{version} macOS Intel.zip'
          with zipfile.ZipFile(z) as f:
              names=f.namelist()
          assert names, 'empty ZIP'
          assert all(n.startswith('HV P2P SRVR.app/') or n == 'HV P2P SRVR.app/' for n in names), names[:20]
          forbidden=('.github/', '/.github/', '.git/', '/.git/', '__pycache__/')
          assert not any(any(token in n for token in forbidden) for n in names), 'repository metadata leaked into release ZIP'
          print('Application ZIP verified: one .app bundle only; no repository metadata.')
          PY

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: HV-P2P-SRVR-v26.08.17.04-macOS-Intel
          path: HV P2P SRVR v26.08.17.04 macOS Intel.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
